apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tamarfr04-design/devops-exercise.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app
  syncPolicy:
    automated:
      prune: true    # delete resources removed from git
      selfHeal: true # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true